name: Publish universal release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.1.0-beta.11

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build one package for Windows, Linux and macOS
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          folder_name="Marginalia-$tag"
          stage="$RUNNER_TEMP/$folder_name"
          app_root="$stage/marginalia"
          archive="$GITHUB_WORKSPACE/$folder_name.zip"
          mkdir -p "$app_root"

          runtime_archive="$RUNNER_TEMP/Marginalia-Windows-v0.1.0-beta.3.zip"
          runtime_root="$RUNNER_TEMP/previous-release"
          runtime_sha256="8d6f44f792aaf9cf8dc8c7170743b8c50e360422acf3a3ea8e81220f0a575d1d"
          curl --fail --location --silent --show-error \
            "https://github.com/K-K-Szostak/marginalia-local-search/releases/download/v0.1.0-beta.3/Marginalia-Windows-v0.1.0-beta.3.zip" \
            --output "$runtime_archive"
          echo "$runtime_sha256  $runtime_archive" | sha256sum --check --strict
          unzip -q "$runtime_archive" -d "$runtime_root"
          runtime_source="$runtime_root/Marginalia-Windows-v0.1.0-beta.3/tools/tesseract"
          runtime_target="$app_root/tools/tesseract"
          mkdir -p "$runtime_target"

          # Copy only reviewed files. Reject absolute paths, traversal, duplicate
          # entries, missing files, and any mismatch between the allowlist and ZIP.
          sed '/^[[:space:]]*$/d; /^[[:space:]]*#/d; s/\r$//' OCR-RUNTIME-FILES.txt > "$RUNNER_TEMP/ocr-expected.txt"
          if grep -Eq '(^/|^[A-Za-z]:|(^|/)\.\.(/|$)|\\)' "$RUNNER_TEMP/ocr-expected.txt"; then
            echo "Unsafe path in OCR-RUNTIME-FILES.txt" >&2
            exit 1
          fi
          if [ "$(sort "$RUNNER_TEMP/ocr-expected.txt" | uniq -d | wc -l)" -ne 0 ]; then
            echo "Duplicate path in OCR-RUNTIME-FILES.txt" >&2
            exit 1
          fi
          while IFS= read -r relative; do
            source_file="$runtime_source/$relative"
            target_file="$runtime_target/$relative"
            test -f "$source_file" || { echo "Missing approved OCR file: $relative" >&2; exit 1; }
            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done < "$RUNNER_TEMP/ocr-expected.txt"
          (cd "$runtime_target" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/ocr-actual.txt"
          sort "$RUNNER_TEMP/ocr-expected.txt" > "$RUNNER_TEMP/ocr-expected-sorted.txt"
          diff -u "$RUNNER_TEMP/ocr-expected-sorted.txt" "$RUNNER_TEMP/ocr-actual.txt"

          echo "babb405f4366b480d02cd8ff2bac8d497170f6c1711ce6f3d5d8bf0fb7fa6ed9  $app_root/tools/tesseract/tesseract.exe" | sha256sum --check --strict
          echo "279488c41bd341edaa03dcd097faa33604ba330e6254ac97bcaf2229d8d7ac1a  $app_root/tools/tesseract/libtesseract-5.dll" | sha256sum --check --strict
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  $app_root/tools/tesseract/tessdata/eng.traineddata" | sha256sum --check --strict

          files=(
            app
            build_semantic_index.py
            build_unified_library.py
            clean_extracted_text.py
            create_empty_library.py
            enrich_metadata.py
            extraction_cache.py
            extract_missing_documents.py
            extract_pdf_corpus.py
            import_obsidian.py
            launcher.py
            library_paths.py
            local_network.py
            LICENSE
            OCR-RUNTIME-FILES.txt
            OCR-RUNTIME-PROVENANCE.txt
            ocr_support.py
            prepare_app_search.py
            progress_output.py
            README.md
            README.txt
            refresh_manager.py
            requirements.txt
            semantic_models.py
            source_manager.py
            "START HERE.txt"
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSES
          )
          cp -R "${files[@]}" "$app_root/"
          cp "Start Marginalia.cmd" "Start Marginalia.sh" "Start Marginalia.command" "$stage/"
          chmod +x "$stage/Start Marginalia.sh" "$stage/Start Marginalia.command"

          (cd "$RUNNER_TEMP" && zip -q -r "$archive" "$folder_name")
          sha256sum "$archive" | sed "s#  .*/#  #" > "$archive.sha256"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          folder_name="Marginalia-$tag"
          notes="Fixes unsafe Obsidian source selection and locked-file snapshot failures. Marginalia now accepts only an actual vault containing a .obsidian directory, skips transiently locked files in a valid vault, and prevents cleanup errors from masking the original refresh error. Also includes the beta.10 linked-attachment setup improvements, beta.9 semantic-refresh fix, and beta.8 Windows long-path fix. One transparent source package for Windows, Linux and macOS. The top folder contains only the three platform launchers and the marginalia application folder. Windows includes the bundled OCR runtime; Linux and macOS can use system Tesseract. Development and risk disclosure: Marginalia was vibe-coded through iterative collaboration with AI coding tools, under human direction and testing. It is experimental beta software, provided as-is and without warranty. It may contain defects; use it at your own risk."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$folder_name.zip" "$folder_name.zip.sha256" --clobber
            gh release edit "$tag" --draft=false --prerelease --title "Marginalia $version" --notes "$notes"
          else
            gh release create "$tag" "$folder_name.zip" "$folder_name.zip.sha256" \
              --title "Marginalia $version" --notes "$notes" --prerelease
          fi
