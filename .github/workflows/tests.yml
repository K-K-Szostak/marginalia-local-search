name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --check app/app.js
      - name: Smoke-test the Windows launcher and running app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MARGINALIA_SMOKE_TEST = "1"
          & ".\Start Marginalia.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the Linux launcher and running app
        if: runner.os == 'Linux'
        shell: bash
        run: MARGINALIA_SMOKE_TEST=1 ./Start\ Marginalia.sh
      - name: Smoke-test the macOS launcher and running app
        if: runner.os == 'macOS'
        shell: bash
        run: MARGINALIA_SMOKE_TEST=1 ./Start\ Marginalia.command
